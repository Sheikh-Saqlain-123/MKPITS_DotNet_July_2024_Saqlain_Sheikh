<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Website Template</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 80%;
            margin: 0 auto;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .navbar {
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            background-color: #eaeaea;
        }
        .navbar a {
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }
        .main-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
        }
        .main-content .text {
            max-width: 50%;
        }
        .main-content .text h1 {
            margin: 0;
            font-size: 2.5em;
        }
        .main-content .text p {
            font-size: 1.2em;
            color: #666;
        }
        .main-content .social-media {
            margin-top: 10px;
        }
        .main-content .social-media a {
            margin-right: 10px;
            text-decoration: none;
            color: #333;
            font-size: 1.5em;
        }
        .main-content .image {
            max-width: 40%;
        }
        .main-content .image img {
            width: 100%;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="navbar">
            <a href="#">BIO</a>
            <a href="#">PORTFOLIO</a>
            <a href="#">PODCAST</a>
            <a href="#">BLOG</a>
        </div>
        <div class="main-content">
            <div class="text">
                <h1>Bethany Jones</h1>
                <p>I'm a dedicated culture critic and blogger located in San Francisco, California.</p>
                <div class="social-media">
                    <a href="https://instagram.com/reallygreatsite" target="_blank">Instagram</a>
                    <a href="https://facebook.com/reallygreatsite" target="_blank">Facebook</a>
                    <a href="https://twitter.com/reallygreatsite" target="_blank">Twitter</a>
                    <a href="https://linkedin.com/reallygreatsite" target="_blank">LinkedIn</a>
                </div>
            </div>
            <div class="image">
                <img src="path_to_image.jpg" alt="Person holding ice cream and flowers">
            </div>
        </div>
    </div>
</body>
</html>
